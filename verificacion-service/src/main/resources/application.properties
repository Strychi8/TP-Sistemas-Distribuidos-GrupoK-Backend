# Nombre de la aplicacion
spring.application.name=verificacion_service
spring.config.import=optional:file:.env[.properties]
server.port=${VERIFICACION_SERVER_PORT:9094}

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-db}:${DB_PORT:3306}/${VERIFICACION_DB_NAME:rentar_verificacion_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${VERIFICACION_DB_USER:verificacion_user}
spring.datasource.password=${VERIFICACION_DB_PASSWORD:verificacion_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion Hibernate/JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Direccion Broker Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# Configuracion Consumidores Kafka
spring.kafka.consumer.group-id=${KAFKA_VERIFICACION_GROUP_ID:vehicle-verificacion-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Configuracion Productores Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

