# Nombre de la aplicacion
spring.application.name=vehicle_service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${VEHICLE_SERVER_PORT:8081}

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${VEHICLE_DB_NAME:rentar_vehicle_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Carga automática de datos iniciales desde data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# gRPC
spring.grpc.server.port=${GRPC_VEHICLE_SERVER_PORT:9090}

# Kafka
# Broker
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
# Config
spring.kafka.consumer.group-id=${KAFKA_VERIFICACION_GROUP_ID:vehicle-verificacion-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer