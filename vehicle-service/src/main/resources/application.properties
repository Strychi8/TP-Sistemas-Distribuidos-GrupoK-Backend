# Nombre de la aplicacion
spring.application.name=vehicle_service
spring.config.import=optional:file:.env[.properties]

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${VEHICLE_DB_NAME:rentar_vehicle_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Carga automatica de datos iniciales desde data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# gRPC
spring.grpc.server.port=${GRPC_VEHICLE_SERVER_PORT:9091}