# Nombre de la aplicacion y puerto
spring.application.name=mantenimiento_service
spring.config.import=optional:file:.env[.properties]
server.port=${MANTENIMIENTO_SERVER_PORT:8084}

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-db}:${DB_PORT:3306}/${MANTENIMIENTO_DB_NAME:rentar_mantenimiento_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:${MANTENIMIENTO_DB_USER:mantenimiento_user}}
spring.datasource.password=${DB_PASSWORD:${MANTENIMIENTO_DB_PASSWORD:mantenimiento_pass}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion Hibernate/JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:mantenimiento-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Actuator
management.endpoints.web.exposure.include=health,info

