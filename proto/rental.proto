syntax = "proto3";

package rentar.rental;

option java_package = "com.rentar.rental.grpc";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// Estados de reservas y mantenimiento.

// Estados del ciclo de vida de una reserva de vehículo.
enum EstadoReserva {
  // El estado no está especificado.
  ESTADO_RESERVA_UNSPECIFIED = 0;

  // La reserva está confirmada.
  ESTADO_RESERVA_CONFIRMADA = 1;

  // La reserva se canceló antes del inicio del alquiler.
  ESTADO_RESERVA_CANCELADA = 2;

  // El alquiler finalizó.
  ESTADO_RESERVA_FINALIZADA = 3;
}

// Resultado del mantenimiento posterior al alquiler.
enum ResultadoMantenimiento {
  // El resultado no está especificado.
  RESULTADO_MANTENIMIENTO_UNSPECIFIED = 0;

  // El vehículo puede volver a estar disponible.
  RESULTADO_MANTENIMIENTO_APROBADO = 1;

  // El vehículo no puede volver a estar disponible.
  RESULTADO_MANTENIMIENTO_RECHAZADO = 2;
}

// Reserva registrada en el sistema.

// Representa una reserva de vehículo en el sistema Rentar.
message Reservation {
  // Identificador de la reserva.
  int64 id_reserva = 1;

  // Identificador del cliente.
  int64 id_cliente = 2;

  // Identificador del vehículo.
  int64 id_vehiculo = 3;

  // Inicio del período de reserva.
  google.protobuf.Timestamp fecha_inicio = 4;

  // Fin del período de reserva.
  google.protobuf.Timestamp fecha_fin = 5;

  // Importe total de la reserva.
  double importe_total = 6;

  // Precio diario acordado.
  double precio_diario = 7;

  // Estado actual de la reserva.
  EstadoReserva estado = 8;

  // Resultado del mantenimiento asociado.
  string resultado_mantenimiento = 9;
}

// Alquiler incluido en el historial de un cliente.
message RentalHistory {
  // Identificador del vehículo.
  int64 id_vehiculo = 1;

  // Inicio del alquiler.
  google.protobuf.Timestamp fecha_inicio = 2;

  // Fecha de finalización o cancelación.
  google.protobuf.Timestamp fecha_finalizacion = 3;

  // Duración del alquiler en días.
  int32 cantidad_dias = 4;

  // Importe total del alquiler.
  double importe_total = 5;

  // Estado final del alquiler.
  EstadoReserva estado = 6;
}

// Mensajes de solicitud y respuesta de RentalService.

// Datos requeridos para crear una reserva.
message CrearReservaRequest {
  // Identificador del cliente.
  int64 id_cliente = 1;

  // Identificador del vehículo.
  int64 id_vehiculo = 2;

  // Inicio de la reserva.
  google.protobuf.Timestamp fecha_inicio = 3;

  // Fin de la reserva.
  google.protobuf.Timestamp fecha_fin = 4;

  // Precio diario acordado.
  double precio_diario = 5;

  // Importe total de la reserva.
  double importe_total = 6;
}

// Resultado de crear una reserva.
message CrearReservaResponse {
  // Reserva creada.
  Reservation reservation = 1;
}

// Filtros opcionales para consultar reservas.
message ConsultarReservasRequest {
  // Filtra por cliente.
  optional int64 id_cliente = 1;

  // Filtra por vehículo.
  optional int64 id_vehiculo = 2;

  // Filtra por estado.
  optional EstadoReserva estado = 3;

  // Inicio mínimo del período.
  optional google.protobuf.Timestamp fecha_desde = 4;

  // Fin máximo del período.
  optional google.protobuf.Timestamp fecha_hasta = 5;
}

// Reservas que coinciden con los filtros.
message ConsultarReservasResponse {
  // Reservas encontradas.
  repeated Reservation reservations = 1;
}

// Identificador de la reserva que se consulta.
message GetReservaByIdRequest {
  // Identificador de la reserva.
  int64 id_reserva = 1;
}

// Reserva consultada.
message GetReservaByIdResponse {
  // Datos de la reserva.
  Reservation reservation = 1;
}

// Identificador de la reserva que se cancela.
message CancelarReservaRequest {
  // Identificador de la reserva.
  int64 id_reserva = 1;
}

// Resultado de cancelar una reserva.
message CancelarReservaResponse {
  // Reserva después de la cancelación.
  Reservation reservation = 1;
}

// Identificador del cliente cuyo historial se consulta.
message ConsultarHistorialAlquileresRequest {
  // Identificador del cliente.
  int64 id_cliente = 1;
}

// Historial de alquileres del cliente.
message ConsultarHistorialAlquileresResponse {
  // Registros del historial.
  repeated RentalHistory history = 1;
}

// Datos para comprobar si un vehículo tiene reservas en un período.
message VerificarSolapamientoVehiculoRequest {
  // Identificador del vehículo.
  int64 id_vehiculo = 1;

  // Inicio del período que se comprueba.
  google.protobuf.Timestamp fecha_inicio = 2;

  // Fin del período que se comprueba.
  google.protobuf.Timestamp fecha_fin = 3;
}

// Resultado de la comprobación de disponibilidad temporal.
message VerificarSolapamientoVehiculoResponse {
  // Indica si el vehículo tiene una reserva en ese período.
  bool solapado = 1;
}

// Operaciones gRPC de reservas, disponibilidad e historial.

service RentalService {
  // Crea una reserva.
  rpc CrearReserva (CrearReservaRequest) returns (CrearReservaResponse);

  // Consulta reservas con filtros opcionales.
  rpc ConsultarReservas (ConsultarReservasRequest) returns (ConsultarReservasResponse);

  // Consulta una reserva por su identificador.
  rpc GetReservaById (GetReservaByIdRequest) returns (GetReservaByIdResponse);

  // Cancela una reserva antes del inicio del alquiler.
  rpc CancelarReserva (CancelarReservaRequest) returns (CancelarReservaResponse);

  // Consulta el historial de alquileres de un cliente.
  rpc ConsultarHistorialAlquileres (ConsultarHistorialAlquileresRequest) returns (ConsultarHistorialAlquileresResponse);

  // Comprueba si hay una reserva del vehículo en el período indicado.
  rpc VerificarSolapamientoVehiculo (VerificarSolapamientoVehiculoRequest) returns (VerificarSolapamientoVehiculoResponse);
}
