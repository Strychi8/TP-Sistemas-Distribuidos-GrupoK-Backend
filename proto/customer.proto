syntax = "proto3";

package rentar.customer;

option java_package = "com.rentar.customer.grpc";
option java_multiple_files = true;

import "google/type/date.proto";

// Datos de un cliente registrado.
message Customer {
  // Identificador del cliente.
  int64 id_cliente = 1;

  // Nombre del cliente.
  string nombre = 2;

  // Apellido del cliente.
  string apellido = 3;

  // Documento nacional de identidad.
  string dni = 4;

  // Correo electrónico.
  string email = 5;

  // Indica si la cuenta está activa.
  bool activo = 6;

  // Teléfono de contacto.
  string telefono = 7;

  // Fecha de nacimiento.
  google.type.Date fecha_nacimiento = 8;
}

// Mensajes de solicitud y respuesta de CustomerService.

// Solicitud para listar clientes.
message GetClientesRequest {
}

// Lista de clientes.
message GetClientesResponse {
  // Clientes encontrados.
  repeated Customer customers = 1;
}

// Identificador del cliente que se consulta.
message GetClienteByIdRequest {
  // Identificador del cliente.
  int64 id_cliente = 1;
}

// Resultado de la consulta por identificador.
message GetClienteByIdResponse {
  // Datos del cliente.
  Customer customer = 1;
}

// Correo del usuario autenticado cuyo perfil se consulta.
message GetMiPerfilRequest {
  // Correo electrónico del usuario.
  string email = 1;
}

// Perfil del cliente autenticado.
message GetMiPerfilResponse {
  // Identificador del cliente.
  int64 id_cliente = 1;

  // Identificador de usuario asociado.
  int64 id_usuario = 2;

  // Correo electrónico.
  string email = 3;

  // Documento de identidad.
  string dni = 4;

  // Nombre del cliente.
  string nombre = 5;

  // Apellido del cliente.
  string apellido = 6;

  // Teléfono de contacto.
  string telefono = 7;

  // Fecha de nacimiento.
  google.type.Date fecha_nacimiento = 8;

  // Indica si la cuenta está activa.
  bool activo = 9;
}

// Documento que se consulta.
message VerificarClienteExistenteRequest {
  // Documento nacional de identidad.
  string dni = 1;
}

// Resultado de la consulta por documento.
message VerificarClienteExistenteResponse {
  // Cliente encontrado, si existe.
  Customer customer = 1;
}

// Identificador del cliente cuyo estado se consulta.
message VerificarClienteActivoRequest {
  // Identificador del cliente.
  int64 id_cliente = 1;
}

// Resultado de la consulta del estado del cliente.
message VerificarClienteActivoResponse {
  // Datos del cliente.
  Customer customer = 1;
}

// Token que se consulta en la lista de revocación.
message VerificarTokenBlacklistRequest {
  // Token JWT.
  string token = 1;
}

// Resultado de la consulta del token.
message VerificarTokenBlacklistResponse {
  // Indica si el token fue revocado.
  bool revocado = 1;
}

// Credenciales de acceso.
message LoginRequest {
  // Correo electrónico.
  string email = 1;

  // Contraseña ingresada.
  string password = 2;
}

// Resultado de la autenticación.
message LoginResponse {
  // Token JWT de acceso.
  string token = 1;
}

// Token que se revoca al cerrar sesión.
message LogoutRequest {
  // Token JWT.
  string token = 1;
}

// Resultado del cierre de sesión.
message LogoutResponse {
  // Indica si la operación se completó.
  bool success = 1;
}

// Datos para crear un cliente.
message CrearClienteRequest {
  // Correo electrónico.
  string email = 1;

  // Contraseña de acceso.
  string password = 2;

  // Documento nacional de identidad.
  string dni = 3;

  // Nombre.
  string nombre = 4;

  // Apellido.
  string apellido = 5;

  // Teléfono.
  string telefono = 6;

  // Fecha de nacimiento.
  google.type.Date fecha_nacimiento = 7;
}

// Resultado de crear el cliente.
message CrearClienteResponse {
  // Cliente creado.
  Customer customer = 1;
}

// Datos para actualizar un cliente.
message ActualizarClienteRequest {
  // Identificador del cliente.
  int64 id_cliente = 1;

  // Correo electrónico.
  string email = 2;

  // Nueva contraseña. Si se omite, se conserva la actual.
  optional string password = 3;

  // Documento de identidad.
  string dni = 4;

  // Nombre.
  string nombre = 5;

  // Apellido.
  string apellido = 6;

  // Teléfono.
  string telefono = 7;

  // Fecha de nacimiento.
  google.type.Date fecha_nacimiento = 8;
}

// Resultado de actualizar el cliente.
message ActualizarClienteResponse {
  // Cliente actualizado.
  Customer customer = 1;
}

// Identificador del cliente que se da de baja.
message EliminarClienteRequest {
  // Identificador del cliente.
  int64 id_cliente = 1;
}

// Resultado de la baja lógica.
message EliminarClienteResponse {
  // Indica si la operación se completó.
  bool success = 1;
}

// Operaciones gRPC de clientes, perfiles y autenticación.
service CustomerService {
  // Lista los clientes registrados.
  rpc GetClientes (GetClientesRequest) returns (GetClientesResponse);

  // Consulta un cliente por su identificador.
  rpc GetClienteById (GetClienteByIdRequest) returns (GetClienteByIdResponse);

  // Consulta el perfil del usuario autenticado.
  rpc GetMiPerfil (GetMiPerfilRequest) returns (GetMiPerfilResponse);

  // Comprueba si existe un cliente con el documento indicado.
  rpc VerificarClienteExistente (VerificarClienteExistenteRequest) returns (VerificarClienteExistenteResponse);

  // Comprueba si el cliente está activo.
  rpc VerificarClienteActivo (VerificarClienteActivoRequest) returns (VerificarClienteActivoResponse);

  // Comprueba si el token JWT fue revocado.
  rpc VerificarTokenBlacklist (VerificarTokenBlacklistRequest) returns (VerificarTokenBlacklistResponse);

  // Autentica al usuario y emite un token JWT.
  rpc Login (LoginRequest) returns (LoginResponse);

  // Cierra la sesión y revoca el token JWT.
  rpc Logout (LogoutRequest) returns (LogoutResponse);

  // Crea un cliente.
  rpc CrearCliente (CrearClienteRequest) returns (CrearClienteResponse);

  // Actualiza un cliente.
  rpc ActualizarCliente (ActualizarClienteRequest) returns (ActualizarClienteResponse);

  // Da de baja lógicamente un cliente.
  rpc EliminarCliente (EliminarClienteRequest) returns (EliminarClienteResponse);
}
