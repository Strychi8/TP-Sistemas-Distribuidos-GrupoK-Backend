// Tipo de fecha usado por customer.proto.
// Basado en: https://github.com/googleapis/googleapis/blob/master/google/type/date.proto
// @grpc/proto-loader no incluye este tipo por defecto. El archivo debe estar en la ruta de búsqueda.

syntax = "proto3";

package google.type;

option java_multiple_files = true;
option java_outer_classname = "DateProto";
option java_package = "com.google.type";
option objc_class_prefix = "GTP";

// Fecha de calendario completa o parcial.
message Date {
  // Año entre 1 y 9999; 0 indica que no se especifica.
  int32 year = 1;

  // Mes entre 1 y 12; 0 indica que no se especifica.
  int32 month = 2;

  // Día válido para el mes y año; 0 indica que no se especifica.
  int32 day = 3;
}
