syntax = "proto3";

package rentar.vehicle;

option java_package = "com.rentar.vehicle.grpc";
option java_multiple_files = true;

// Categorías y estados de vehículos.

// Tipos de vehículo admitidos.
enum TipoVehiculo {
  // El tipo no está especificado.
  TIPO_VEHICULO_UNSPECIFIED = 0;

  // Sedán.
  TIPO_VEHICULO_SEDAN = 1;

  // Vehículo utilitario deportivo.
  TIPO_VEHICULO_SUV = 2;

  // Camioneta con caja de carga abierta.
  TIPO_VEHICULO_PICKUP = 3;

  // Cupé.
  TIPO_VEHICULO_COUPE = 4;

  // Automóvil con portón trasero integrado.
  TIPO_VEHICULO_HATCHBACK = 5;
}

// Estado operativo de un vehículo.
enum EstadoVehiculo {
  // El estado no está especificado.
  ESTADO_VEHICULO_UNSPECIFIED = 0;

  // El vehículo está disponible.
  ESTADO_VEHICULO_DISPONIBLE = 1;

  // El vehículo tiene una reserva.
  ESTADO_VEHICULO_RESERVADO = 2;

  // El vehículo está alquilado.
  ESTADO_VEHICULO_EN_ALQUILER = 3;
}

// Estado de la solicitud de incorporación de un vehículo externo.
enum EstadoVehiculoExterno {
  // El estado no está especificado.
  ESTADO_VEHICULO_EXTERNO_UNSPECIFIED = 0;

  // La solicitud está pendiente de validación.
  ESTADO_VEHICULO_EXTERNO_PENDIENTE = 1;

  // La solicitud fue aprobada.
  ESTADO_VEHICULO_EXTERNO_APROBADO = 2;

  // La solicitud fue rechazada.
  ESTADO_VEHICULO_EXTERNO_RECHAZADO = 3;
}

// Vehículo de la flota.
message Vehicle {
  // Identificador del vehículo.
  int64 id_vehiculo = 1;

  // Patente del vehículo.
  string patente = 2;

  // Marca.
  string marca = 3;

  // Modelo.
  string modelo = 4;

  // Año de fabricación.
  int32 anio = 5;

  // Color.
  string color = 6;

  // Tipo de vehículo.
  TipoVehiculo tipo_vehiculo = 7;

  // Precio diario de alquiler.
  double precio_diario = 8;

  // Estado operativo.
  EstadoVehiculo estado = 9;

  // Indica si el vehículo está activo.
  bool activo = 10;

  // Indica si el vehículo está inhabilitado.
  bool inhabilitado = 11;
}

// Solicitud para incorporar un vehículo externo.
message VehiculoExterno {
  // Identificador de la solicitud.
  int64 id_vehiculo_externo = 1;

  // Identificador del cliente.
  int64 id_cliente = 2;

  // Patente del vehículo.
  string patente = 3;

  // Marca.
  string marca = 4;

  // Modelo.
  string modelo = 5;

  // Año de fabricación.
  int32 anio = 6;

  // Color.
  string color = 7;

  // Tipo de vehículo.
  TipoVehiculo tipo_vehiculo = 8;

  // Estado de la solicitud.
  string estado = 9;

  // Resultado de la validación policial.
  string validacion_patente = 10;

  // Resultado de la validación de titularidad.
  string validacion_titularidad = 11;

  // Identificador del vehículo incorporado, si corresponde.
  int64 id_vehiculo = 12;

  // Precio diario solicitado.
  double precio_diario = 13;
}

// Mensajes de solicitud y respuesta de VehicleService.

// Datos para crear un vehículo.
message CrearVehiculoRequest {
  // Patente.
  string patente = 1;

  // Marca.
  string marca = 2;

  // Modelo.
  string modelo = 3;

  // Año de fabricación.
  int32 anio = 4;

  // Color.
  string color = 5;

  // Tipo de vehículo.
  TipoVehiculo tipo_vehiculo = 6;

  // Precio diario.
  double precio_diario = 7;
}

// Resultado de crear el vehículo.
message CrearVehiculoResponse {
  // Vehículo creado.
  Vehicle vehicle = 1;
}

// Datos para actualizar un vehículo.
message ActualizarVehiculoRequest {
  // Identificador del vehículo.
  int64 id_vehiculo = 1;

  // Marca.
  string marca = 2;

  // Modelo.
  string modelo = 3;

  // Año de fabricación.
  int32 anio = 4;

  // Color.
  string color = 5;

  // Tipo de vehículo.
  TipoVehiculo tipo_vehiculo = 6;

  // Precio diario.
  double precio_diario = 7;

  // Estado operativo.
  EstadoVehiculo estado = 8;
}

// Resultado de actualizar el vehículo.
message ActualizarVehiculoResponse {
  // Vehículo actualizado.
  Vehicle vehicle = 1;
}

// Datos para actualizar el estado operativo.
message ActualizarEstadoVehiculoRequest {
  // Identificador del vehículo.
  int64 id_vehiculo = 1;

  // Nuevo estado.
  EstadoVehiculo estado = 2;
}

// Resultado de actualizar el estado.
message ActualizarEstadoVehiculoResponse {
  // Vehículo actualizado.
  Vehicle vehicle = 1;
}

// Identificador del vehículo que se da de baja.
message EliminarVehiculoRequest {
  // Identificador del vehículo.
  int64 id_vehiculo = 1;
}

// Resultado de la baja lógica.
message EliminarVehiculoResponse {
  // Indica si la operación se completó.
  bool success = 1;
}

// Solicitud para listar vehículos.
message GetVehiculosRequest {
}

// Lista de vehículos.
message GetVehiculosResponse {
  // Vehículos registrados.
  repeated Vehicle vehicles = 1;
}

// Solicitud para listar vehículos activos.
message GetVehiculosActivosRequest {
}

// Lista de vehículos activos.
message GetVehiculosActivosResponse {
  // Vehículos activos.
  repeated Vehicle vehicles = 1;
}

// Identificador del vehículo que se consulta.
message GetVehiculoByIdRequest {
  // Identificador del vehículo.
  int64 id_vehiculo = 1;
}

// Resultado de la consulta por identificador.
message GetVehiculoByIdResponse {
  // Vehículo encontrado.
  Vehicle vehicle = 1;
}

// Patente del vehículo que se consulta.
message GetVehiculoByPatenteRequest {
  // Patente.
  string patente = 1;
}

// Resultado de la consulta por patente.
message GetVehiculoByPatenteResponse {
  // Vehículo encontrado.
  Vehicle vehicle = 1;
}

// Filtros opcionales para consultar disponibilidad.
message ConsultarDisponibilidadRequest {
  // Filtra por tipo.
  optional TipoVehiculo tipo_vehiculo = 1;

  // Filtra por marca.
  optional string marca = 2;

  // Filtra por modelo.
  optional string modelo = 3;

  // Precio diario mínimo.
  optional double precio_min = 4;

  // Precio diario máximo.
  optional double precio_max = 5;
}

// Vehículos que coinciden con los filtros.
message ConsultarDisponibilidadResponse {
  // Vehículos disponibles.
  repeated Vehicle vehicles = 1;
}

// Datos para registrar un vehículo externo.
message RegistrarVehiculoExternoRequest {
  // Patente.
  string patente = 1;

  // Marca.
  string marca = 2;

  // Modelo.
  string modelo = 3;

  // Año de fabricación.
  int32 anio = 4;

  // Color.
  string color = 5;

  // Tipo de vehículo.
  TipoVehiculo tipo_vehiculo = 6;

  // Precio diario solicitado.
  double precio_diario = 7;

  // Documento de identidad del titular.
  string documento = 8;

  // Identificador del cliente autenticado.
  int64 id_cliente = 9;
}

// Resultado del registro del vehículo externo.
message RegistrarVehiculoExternoResponse {
  // Solicitud creada.
  VehiculoExterno vehiculo_externo = 1;
}

// Identificador del cliente cuyas solicitudes se consultan.
message GetVehiculosExternosByClienteRequest {
  // Identificador del cliente.
  int64 id_cliente = 1;
}

// Solicitudes de vehículos externos del cliente.
message GetVehiculosExternosByClienteResponse {
  // Vehículos externos.
  repeated VehiculoExterno vehiculos_externos = 1;
}

// Operaciones gRPC de catálogo, disponibilidad y gestión de vehículos.
service VehicleService {
  // Crea un vehículo.
  rpc CrearVehiculo (CrearVehiculoRequest) returns (CrearVehiculoResponse);

  // Actualiza un vehículo.
  rpc ActualizarVehiculo (ActualizarVehiculoRequest) returns (ActualizarVehiculoResponse);

  // Actualiza el estado operativo.
  rpc ActualizarEstadoVehiculo (ActualizarEstadoVehiculoRequest) returns (ActualizarEstadoVehiculoResponse);

  // Da de baja lógicamente un vehículo.
  rpc EliminarVehiculo (EliminarVehiculoRequest) returns (EliminarVehiculoResponse);

  // Lista los vehículos registrados.
  rpc GetVehiculos (GetVehiculosRequest) returns (GetVehiculosResponse);

  // Lista los vehículos activos.
  rpc GetVehiculosActivos (GetVehiculosActivosRequest) returns (GetVehiculosActivosResponse);

  // Consulta un vehículo por su identificador.
  rpc GetVehiculoById (GetVehiculoByIdRequest) returns (GetVehiculoByIdResponse);

  // Consulta un vehículo por su patente.
  rpc GetVehiculoByPatente (GetVehiculoByPatenteRequest) returns (GetVehiculoByPatenteResponse);

  // Consulta disponibilidad con filtros opcionales.
  rpc ConsultarDisponibilidad (ConsultarDisponibilidadRequest) returns (ConsultarDisponibilidadResponse);

  // Registra una solicitud de incorporación de vehículo externo.
  rpc RegistrarVehiculoExterno (RegistrarVehiculoExternoRequest) returns (RegistrarVehiculoExternoResponse);

  // Lista las solicitudes de vehículos externos de un cliente.
  rpc GetVehiculosExternosByCliente (GetVehiculosExternosByClienteRequest) returns (GetVehiculosExternosByClienteResponse);
}
