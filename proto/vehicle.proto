syntax = "proto3";

package rentar.vehicle;

option java_package = "com.rentar.vehicle.grpc";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

enum TipoVehiculo {
  TIPO_VEHICULO_UNSPECIFIED = 0;
  AUTO = 1;
  MOTO = 2;
  CAMIONETA = 3;
}

enum EstadoVehiculo {
  ESTADO_VEHICULO_UNSPECIFIED = 0;
  DISPONIBLE = 1;
  ALQUILADO = 2;
  EN_MANTENIMIENTO = 3;
  INACTIVO = 4;
}

message Vehicle {
  int64 idVehiculo = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  string color = 6;
  TipoVehiculo tipoVehiculo = 7;
  double precioDiario = 8;
  EstadoVehiculo estado = 9;
  bool activo = 10; // Necesario para que el Gateway distinga entre 404 (no existe) y 400 (inactivo)
}

message VehicleList {
  repeated Vehicle vehicles = 1;
  int64 total_elements = 2;
  int32 total_pages = 3;
}

message FiltroDisponibilidad {
  optional TipoVehiculo tipoVehiculo = 1;
  optional string marca = 2;
  optional string modelo = 3;
  optional double precioMin = 4;
  optional double precioMax = 5;
  int32 page = 6;
  int32 size = 7;
}

message RangoFechas {
  google.protobuf.Timestamp fechaInicio = 1;
  google.protobuf.Timestamp fechaFin = 2;
}

message ActualizarEstadoRequest {
  int64 idVehiculo = 1;
  EstadoVehiculo estado = 2;
}

message GetVehiculoByIdRequest {
  int64 idVehiculo = 1;
}

message CheckDisponibilidadRequest {
  int64 idVehiculo = 1;
  google.protobuf.Timestamp fechaInicio = 2;
  google.protobuf.Timestamp fechaFin = 3;
}

message CheckDisponibilidadResponse {
  bool disponible = 1;
}

service VehicleService {
  rpc GetVehiculos (FiltroDisponibilidad) returns (VehicleList);
  rpc GetVehiculoById (GetVehiculoByIdRequest) returns (Vehicle);
  rpc VerificarDisponibilidad (CheckDisponibilidadRequest) returns (CheckDisponibilidadResponse);
  rpc ActualizarEstadoVehiculo (ActualizarEstadoRequest) returns (Vehicle);
}
