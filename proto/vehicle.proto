syntax = "proto3";

package rentar.vehicle;

option java_package = "com.rentar.vehicle.grpc";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum TipoVehiculo {
  TIPO_VEHICULO_UNSPECIFIED = 0;
  SEDAN = 1;
  SUV = 2;
  PICKUP = 3;
  COUPE = 4;
  HATCHBACK = 5;
}

enum EstadoVehiculo {
  ESTADO_VEHICULO_UNSPECIFIED = 0;
  DISPONIBLE = 1;
  RESERVADO = 2;
  EN_ALQUILER = 3;
}

enum EstadoVehiculoExterno {
  ESTADO_EXTERNO_UNSPECIFIED = 0;
  PENDIENTE = 1;
  APROBADO = 2;
  RECHAZADO = 3;
}

message Vehicle {
  int64 idVehiculo = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  string color = 6;
  TipoVehiculo tipoVehiculo = 7;
  double precioDiario = 8;
  EstadoVehiculo estado = 9;
  bool activo = 10; // Necesario para que el Gateway distinga entre 404 (no existe) y 400 (inactivo)
  bool inhabilitado = 11;
}

message VehicleList {
  repeated Vehicle vehicles = 1;
}

message FiltroDisponibilidad {
  optional TipoVehiculo tipoVehiculo = 1;
  optional string marca = 2;
  optional string modelo = 3;
  optional double precioMin = 4;
  optional double precioMax = 5;
}

message RangoFechas {
  google.protobuf.Timestamp fechaInicio = 1;
  google.protobuf.Timestamp fechaFin = 2;
}

message ActualizarEstadoRequest {
  int64 idVehiculo = 1;
  EstadoVehiculo estado = 2;
}

message GetVehiculoByIdRequest {
  int64 idVehiculo = 1;
}

message CrearVehiculoRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  TipoVehiculo tipoVehiculo = 6;
  double precioDiario = 7;
}

message ActualizarVehiculoRequest {
  int64 idVehiculo = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  TipoVehiculo tipoVehiculo = 6;
  double precioDiario = 7;
  EstadoVehiculo estado = 8;
}

message EliminarVehiculoRequest {
  int64 idVehiculo = 1;
}

message EliminarVehiculoResponse {
  bool success = 1;
}

message GetVehiculoByPatenteRequest {
  string patente = 1;
}

message RegistrarVehiculoExternoRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  TipoVehiculo tipoVehiculo = 6;
  double precioDiario = 7;
  string documento = 8;
  int64 clienteId = 9;
}

message VehiculoExternoResponse {
  int64 idVehiculoExterno = 1;
  int64 clienteId = 2;
  string patente = 3;
  string marca = 4;
  string modelo = 5;
  int32 anio = 6;
  string color = 7;
  TipoVehiculo tipoVehiculo = 8;
  string estado = 9;
  string validacionPatente = 10;
  string validacionTitularidad = 11;
  int64 vehiculoId = 12;
  double precioDiario = 13;
}

message GetVehiculosExternosByClienteRequest {
  int64 clienteId = 1;
}

message VehiculoExternoList {
  repeated VehiculoExternoResponse vehiculosExternos = 1;
}

service VehicleService {
  rpc CrearVehiculo (CrearVehiculoRequest) returns (Vehicle);
  rpc ActualizarVehiculo (ActualizarVehiculoRequest) returns (Vehicle);
  rpc ActualizarEstadoVehiculo (ActualizarEstadoRequest) returns (Vehicle);
  rpc EliminarVehiculo (EliminarVehiculoRequest) returns (EliminarVehiculoResponse);
  rpc GetVehiculos (google.protobuf.Empty) returns (VehicleList);
  rpc GetVehiculosActivos (google.protobuf.Empty) returns (VehicleList);
  rpc GetVehiculoById (GetVehiculoByIdRequest) returns (Vehicle);
  rpc GetVehiculoByPatente (GetVehiculoByPatenteRequest) returns (Vehicle);
  rpc ConsultarDisponibilidad(FiltroDisponibilidad) returns (VehicleList);
  rpc RegistrarVehiculoExterno (RegistrarVehiculoExternoRequest) returns (VehiculoExternoResponse);
  rpc GetVehiculosExternosByCliente (GetVehiculosExternosByClienteRequest) returns (VehiculoExternoList);
}
